# Clippy configuration
# https://doc.rust-lang.org/clippy/configuration.html
#
# NOTE: These thresholds were raised (from 15/50/7) to grandfather existing physics
# code (largest current offenders: cognitive complexity 51, a 928-line function, and
# a 23-argument function). They should be lowered over time as code is refactored.

# Maximum cognitive complexity allowed
cognitive-complexity-threshold = 55

# Maximum lines in a function
too-many-lines-threshold = 950

# Maximum number of arguments in a function
too-many-arguments-threshold = 25
