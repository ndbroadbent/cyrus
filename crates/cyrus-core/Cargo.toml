[package]
name = "cyrus-core"
description = "Core mathematical primitives for Calabi-Yau manifold computations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
rayon.workspace = true
faer = { workspace = true, features = ["svd"] }
malachite = { version = "0.4", features = ["floats"] }
ode_solvers = { workspace = true }
nalgebra = { workspace = true }
rand = { workspace = true }
rsparse = "1.2"
cygv = "0.1.2"
rug = "1.28"
good_lp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
proptest.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
insta = { version = "1.34", features = ["json"] }
trybuild = "1"
criterion.workspace = true

[[bench]]
name = "polytope"
harness = false

[[bench]]
name = "triangulation"
harness = false

[[bench]]
name = "intersection"
harness = false
