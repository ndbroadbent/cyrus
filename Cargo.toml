[workspace]
resolver = "2"
members = [
    "crates/cyrus-core",
]

# Workspace-wide lints (strict by default)
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Allow these pedantic lints
module_name_repetitions = "allow" # Types like `ConeError` in `cone` module are fine
must_use_candidate = "allow" # Not all methods need #[must_use]
similar_names = "allow"
unreadable_literal = "allow"  # Physics constants shouldn't need underscores
doc_markdown = "allow"  # CamelCase names (McAllister, GitHub) aren't code
# Disable cargo metadata warnings for now
cargo_common_metadata = "allow"
# Allow multiple versions of transitive deps (out of our control)
multiple_crate_versions = "allow"
# Allows for intentional patterns in physics code (apply to lib, bins, and tests alike)
cast_precision_loss = "allow" # i64 to f64 is intentional for floating point math
cast_possible_wrap = "allow" # usize to i64 is safe for our data sizes
cast_possible_truncation = "allow" # Safe truncations are checked at runtime
cast_sign_loss = "allow" # Safe sign conversions are checked at runtime
missing_panics_doc = "allow" # Not all panic conditions need documentation
missing_errors_doc = "allow" # Not all error conditions need documentation
needless_range_loop = "allow" # Matrix operations are clearer with index loops
branches_sharing_code = "allow" # Sometimes clearer to repeat code in branches
if_then_some_else_none = "allow" # Pattern is fine
items_after_statements = "allow" # Test helper structs in functions are fine
type_complexity = "allow" # Complex types are acceptable in physics code
single_match_else = "allow" # Match with single arm is sometimes clearer
match_same_arms = "allow" # Sometimes clearer to be explicit about same behavior
option_if_let_else = "allow" # Pattern is often clearer than map_or_else
needless_collect = "allow" # Sometimes collect is clearer
only_used_in_recursion = "allow" # False positives in some algorithms
redundant_else = "allow" # Explicit else for clarity
manual_let_else = "allow" # let...else not always clearer
cmp_owned = "allow" # Owned comparison is sometimes clearer
return_self_not_must_use = "allow" # Methods returning Self don't always need must_use
no_effect_underscore_binding = "allow" # Debug variables are fine
# CRITICAL: mul_add changes floating-point results at the ULP level; this project
# validates bit-level reproduction of published physics values, so float expression
# rewrites are forbidden.
suboptimal_flops = "allow"
# Exact equality against pinned/published values is intentional in this codebase's
# validation layers.
float_cmp = "allow"
# Series/scalar helpers intentionally take owned values (callers usually construct
# them inline); rewriting every call site to borrow is deferred refactoring.
needless_pass_by_value = "allow"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ndbroadbent/cyrus"
authors = ["Nathan Broadbent <nathan@ndbroadbent.com>"]
keywords = ["calabi-yau", "string-theory", "physics", "cosmology"]
categories = ["science", "mathematics"]

[workspace.dependencies]
# Math
nalgebra = "0.33"
ndarray = "0.16"
num-rational = "0.4"
num-integer = "0.1"
num-traits = "0.2"
rand = "0.8"

# Arbitrary precision (pure Rust, LGPL)
malachite = "0.4"

# Linear algebra
faer = "0.20"  # Fast pure-Rust linear algebra

# Triangulations (pure Rust, CGAL-inspired, d-dimensional)
delaunay = "0.4"

# Lattice reduction
lll-rs = "0.4"

# Linear programming (for Kähler cone tests)
good_lp = { version = "1.14", default-features = false, features = ["highs"] }

# Tensor contraction
ndarray_einsum_beta = "0.7"

# Numerical integration (for period computations)
quadrature = "0.1"

# ODE solvers
ode_solvers = "0.5"

# Parallelism
rayon = "1.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Compression
zstd = "0.13"

# Hashing
xxhash-rust = { version = "0.8", features = ["xxh3"] }
ahash = "0.8"

# Caching
moka = { version = "0.12", features = ["sync"] }  # Concurrent cache

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Testing
proptest = "1.5"
criterion = "0.5"

# Error handling
thiserror = "2"
anyhow = "1"

[profile.release]
lto = "fat"
codegen-units = 1
# GA searches evaluate many candidate geometries. Keep unwinding enabled so
# candidate-local panic guards around third-party numerical code can return
# explicit errors instead of aborting the whole run.
panic = "unwind"

[profile.bench]
inherits = "release"
debug = true
